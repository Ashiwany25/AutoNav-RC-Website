name: Python simulator tests
on:
  push:
    paths:
      - 'api/**'
      - 'hardware/**'
      - 'mapping/**'
      - 'navigation/**'
      - 'simulation/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests with virtual display
        run: xvfb-run -a python -m unittest discover -s tests -q
